
name: Build Pygame Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "game.py"
      - ".github/workflows/build-apk.yml"

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev


      - name: Install python-for-android
        run: |

          python -m pip install --upgrade pip

          pip install \
            python-for-android


      - name: Build APK
        run: |

          mkdir -p build

          p4a apk \
            --private . \
            --package org.course.pygamegame \
            --name PygameGame \
            --version 1.0 \
            --bootstrap sdl2 \
            --requirements python3,pygame-ce \
            --arch arm64-v8a \
            --orientation landscape \
            --output build/PygameGame.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: PygameGame-APK

          path: build/PygameGame.apk
